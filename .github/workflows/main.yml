name: Build CI

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'true'
      version:
        description: 'release version'
        required: false
        default: '2026110101'

jobs:
  Build-on-Ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: UTC-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update system and install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y make build-essential git curl

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Clone KernelPatch and Generate Headers
        run: |
          git clone --depth=1 https://github.com/bmax121/KernelPatch.git KernelPatch
          cd KernelPatch/kernel
          make hdr
          cd ../tools
          make -j$(nproc)

      - name: Build kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
        run: |
          mkdir -p target
          
          # 使用 printf 严格保证 Makefile 的 Tab 缩进，避免被 YAML 破坏
          printf 'KPM_NAME := APKey_Hide\n' > Makefile
          printf 'KPM_VERSION := 3.6.2\n' >> Makefile
          printf 'KPM_SRC := APKey_Hide.c\n' >> Makefile
          printf 'KP_DIR := $(CURDIR)/KernelPatch\n' >> Makefile
          printf 'all:\n\t$(MAKE) -C $(KP_DIR)/kernel KPM_NAME=$(KPM_NAME) KPM_VERSION=$(KPM_VERSION) KPM_SRC=$(CURDIR)/$(KPM_SRC) KPTOOLS=$(KP_DIR)/tools/kptools CC=$(TARGET_COMPILE)gcc\n' >> Makefile
          
          # 强制执行编译
          make
          
          echo "======== 编译执行完毕，当前根目录文件 ========"
          ls -la
          
          # 查找并移动产物
          find . -name "*.kpm" -type f | while read kpm_file; do
              filename=$(basename "$kpm_file")
              new_filename=$(echo "$filename" | sed -E 's/_[0-9]+\.[0-9]+(\.[0-9]+)?\.kpm/.kpm/')
              mv "$kpm_file" "target/$new_filename"
              echo "成功提取产物: $kpm_file -> target/$new_filename"
          done
          
          echo "======== target 目录内容 ========"
          ls -la target/
          
          # 如果 target 是空的，直接报错，绝不静默跳过
          if [ -z "$(ls -A target)" ]; then
            echo "Error: 编译失败，没有找到 .kpm 文件！请检查上方编译日志。"
            exit 1
          fi

      - name: Upload artifact
        uses: lzghzr/upload-artifact@405e6269d5b1feb22bf2a044deb7950596bed6da
        with:
          path: "target/*.kpm"
          artifact-per-file: true
          artifact-name-rule: ${name}

      - name: Upload release
        if: github.event.inputs.release == 'true' && success() && !cancelled()
        uses: ncpollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: This release is built by github-action.
          artifacts: "target/*.kpm"
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true
